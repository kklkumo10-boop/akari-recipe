<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あかりごはん</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5f0e8;
    --warm: #e8dcc8;
    --ink: #2c2016;
    --rust: #c4622d;
    --season-color: #c4622d;
  }

  body {
    background-color: var(--cream);
    color: var(--ink);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(196,98,45,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(107,124,92,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  header { text-align: center; margin-bottom: 48px; }

  .season-badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--season-color);
    border: 1px solid var(--season-color);
    padding: 4px 16px;
    margin-bottom: 20px;
    animation: fadeUp 0.6s ease forwards;
  }

  h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(36px, 8vw, 52px);
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.2;
    animation: fadeUp 0.6s ease 0.1s both;
  }

  h1 span {
    display: block;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.3em;
    color: var(--rust);
    margin-top: 8px;
    font-family: 'Noto Serif JP', serif;
  }

  .divider {
    width: 40px; height: 1px;
    background: var(--rust);
    margin: 24px auto;
    animation: fadeUp 0.6s ease 0.2s both;
  }

  .subtitle {
    font-size: 13px;
    color: #7a6a58;
    letter-spacing: 0.1em;
    animation: fadeUp 0.6s ease 0.3s both;
  }

  .recipe-card {
    background: white;
    border: 1px solid rgba(196,98,45,0.15);
    padding: 36px 36px 32px;
    margin-bottom: 24px;
    position: relative;
    box-shadow: 4px 4px 0 rgba(196,98,45,0.08);
    animation: fadeUp 0.7s ease 0.4s both;
    overflow: hidden;
  }

  .recipe-card::before, .recipe-card::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--rust);
    border-style: solid;
    opacity: 0.4;
  }
  .recipe-card::before { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
  .recipe-card::after  { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

  .recipe-label {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--rust);
    margin-bottom: 12px;
  }

  .season-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.15em;
    padding: 2px 10px;
    border: 1px solid var(--season-color);
    color: var(--season-color);
    margin-bottom: 14px;
  }

  .recipe-title {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .recipe-desc {
    font-size: 14px;
    line-height: 1.9;
    color: #5a4e42;
    margin-bottom: 24px;
    border-left: 2px solid var(--warm);
    padding-left: 16px;
  }

  /* X埋め込みエリア */
  .tweet-wrap {
    margin-bottom: 20px;
    border-top: 1px solid var(--warm);
    padding-top: 20px;
  }

  .tweet-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #9a8878;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tweet-label::before {
    content: '✕';
    font-size: 11px;
    font-weight: 700;
    color: var(--ink);
  }

  /* twitter-tweet ブロックを中央寄せしない（左寄せ） */
  .twitter-tweet {
    margin: 0 !important;
  }

  .tweet-loading {
    font-size: 12px;
    color: #b0a090;
    letter-spacing: 0.1em;
    padding: 16px 0;
  }

  /* Xで見るリンク（fallback） */
  .x-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--rust);
    text-decoration: none;
    letter-spacing: 0.1em;
    margin-top: 8px;
    opacity: 0.85;
    transition: opacity 0.2s;
  }
  .x-link:hover { opacity: 1; text-decoration: underline; }

  .recipe-meta {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .meta-item {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #9a8878;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .meta-item::before {
    content: '◆';
    font-size: 6px;
    color: var(--rust);
    opacity: 0.6;
  }

  .recipe-counter {
    text-align: right;
    font-size: 11px;
    color: #b0a090;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }

  .btn-wrap {
    text-align: center;
    animation: fadeUp 0.7s ease 0.5s both;
  }

  button {
    background: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    padding: 14px 40px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--ink);
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: -1;
  }
  button:hover { color: var(--cream); }
  button:hover::after { transform: translateY(0); }

  footer {
    text-align: center;
    margin-top: 48px;
    font-size: 11px;
    color: #b0a090;
    letter-spacing: 0.12em;
    line-height: 2;
    animation: fadeUp 0.7s ease 0.6s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .swap { animation: fadeUp 0.35s ease; }

  .spring { --season-color: #c4866e; }
  .summer { --season-color: #4a8a6e; }
  .autumn { --season-color: #c4622d; }
  .winter { --season-color: #5a6a8a; }
</style>
</head>
<body>
<div class="container" id="app">
  <header>
    <div class="season-badge" id="seasonBadge"></div>
    <h1>あかりごはん<span>長谷川あかりのきょうのレシピ</span></h1>
    <div class="divider"></div>
    <p class="subtitle">今日も、おいしいものをつくろう。</p>
  </header>

  <p class="recipe-counter" id="counter"></p>

  <div class="recipe-card" id="recipeCard">
    <p class="recipe-label">Today's Recipe</p>
    <div class="season-tag" id="seasonTag"></div>
    <h2 class="recipe-title" id="recipeTitle"></h2>
    <p class="recipe-desc" id="recipeDesc"></p>
    <div class="recipe-meta" id="recipeMeta"></div>
    <div class="tweet-wrap" id="tweetWrap"></div>
  </div>

  <div class="btn-wrap">
    <button onclick="nextRecipe()">別のレシピを見る</button>
  </div>

  <footer>
    <div style="font-size:28px; margin-bottom:10px;">🥢</div>

    <p>食材・分量・手順はXの投稿でご確認ください</p>
  </footer>
</div>

  { season:["春"], title:"ラディッシュの浅漬け", desc:"春が旬のラディッシュを塩で揉むだけで完成する即席漬け。鮮やかな赤が食卓を彩り、カレーに添えるだけで華やかになる。", ingredients:"ラディッシュ、塩、酢", time:"約10分", url:"https://lee.hpplus.jp/column/3192920/", source:"LEE" },
  { season:["夏"], title:"甘辛トマ牛", desc:"トマトの酸味と牛肉の甘み、醤油のしょっぱさ、大葉のさわやかさが混然一体となる夏の名品。ご飯にのせてトマ牛丼にするのもおすすめ。", ingredients:"牛肉、トマト、大葉、醤油", time:"約10分", url:"https://note.com/moyuri/n/n85843141b3dc", source:"note" },
  { season:["夏"], title:"豚しゃぶそうめん にらどっさり梅だれ", desc:"残暑疲れに効くにらたっぷりの梅だれそうめん。さっぱりしているのにスタミナがつく、夏の終わりに毎年作りたくなる一皿。", ingredients:"そうめん、豚しゃぶ用肉、にら、梅干し", time:"約15分", url:"https://www.orangepage.net/food/series-food/akarikihon", source:"オレンジページ" },
  { season:["夏"], title:"サバ缶と梅干しの夏カレー", desc:"さらっとおいしい夏のカレー、秘密は梅干し。サバ缶の旨みと梅の酸味が合わさってさっぱりした後味。暑い日でも食欲がわく。", ingredients:"サバ缶、梅干し、カレー粉、玉ねぎ", time:"約20分", url:"https://esse-online.jp/list/special/recipe-hasegawaakari", source:"ESSE online" },
  { season:["夏"], title:"納豆とトマトとコチュジャン丼", desc:"火を使わず混ぜるだけで完成。納豆にトマトとコチュジャンを合わせる大胆さがあかりさんらしい。夏バテも吹き飛ぶ力強い一杯。", ingredients:"納豆、トマト、コチュジャン、ご飯", time:"約5分", url:"https://lee.hpplus.jp/column/3192920/", source:"LEE" },
  { season:["夏"], title:"鮭のムニエル ガーリック青のりバターソース", desc:"子供ウケダントツ一位のレシピ。にんにくとバターと青のりの魅惑的な香りに誰もが引き寄せられる。ソースは多めに作るのが正解。", ingredients:"鮭、青のり、バター、にんにく", time:"約15分", url:"https://baila.hpplus.jp/lifestyle/recipegourmet/63054", source:"BAILA" },
  { season:["夏"], title:"ニラたまパスタ", desc:"パワーチャージしたい日に。ニラと卵のシンプルな組み合わせがガツンとした満足感をくれる。疲れた夜でも10分で完成する頼れる一皿。", ingredients:"パスタ、卵、にら、ごま油", time:"約15分", url:"https://baila.hpplus.jp/lifestyle/recipegourmet/78390", source:"BAILA" },
  { season:["秋"], title:"切り干し大根とトマトジュースのチキンカレー", desc:"切り干し大根を戻さずそのままフライパンへ。旨みが煮汁に全部移って、鶏肉とトマトジュースのおいしさが重なり合う。LEEランキング1位の傑作。", ingredients:"切り干し大根、鶏肉、トマトジュース、カレー粉", time:"約25分", url:"https://lee.hpplus.jp/column/3192920/", source:"LEE" },
  { season:["秋"], title:"かぼちゃと豚肉の炊き込みご飯 にんにく風味", desc:"かぼちゃを豚肉と炊き込む意外な組み合わせを成立させるのはにんにく。大ぶりカットでほくほく感を楽しんで、ゆずこしょうで味変も◎。", ingredients:"米、かぼちゃ、豚肉、にんにく", time:"約40分", url:"https://lee.hpplus.jp/column/3192920/", source:"LEE" },
  { season:["秋"], title:"ぶりとみょうがのバター炒め", desc:"脂がのった秋のぶりとさわやかなみょうがをバターでまとめる。調味料をそぎ落としたシンプルさで素材の味わいが主役の一皿。", ingredients:"ぶり、みょうが、バター、酒", time:"約15分", url:"https://baila.hpplus.jp/lifestyle/recipegourmet/63054", source:"BAILA" },
  { season:["秋"], title:"鶏肉と厚揚げのツヤ照り炒め", desc:"ツヤッとした照りが食欲をそそる秋のメインおかず。厚揚げが鶏肉のかさを増してコスパよし。甘辛だれがご飯に最高に合う。", ingredients:"鶏肉、厚揚げ、醤油、みりん", time:"約15分", url:"https://esse-online.jp/list/special/recipe-hasegawaakari", source:"ESSE online" },
  { season:["冬"], title:"豚汁 長谷川あかり流", desc:"30分放置がおいしさの決め手。火を止めてじっくり休ませることで味しみと香りが全然違うと話題。冬の寒い夜に体の芯まで温まる一椀。", ingredients:"豚バラ肉、大根、にんじん、ごぼう", time:"約40分（放置込み）", url:"https://www.orangepage.net/food/series-food/akarikihon", source:"オレンジページ" },
  { season:["冬"], title:"みそスペアリブと大根のフライパン蒸し", desc:"骨つき肉の旨みを吸った大根までおいしいフライパンひとつのごちそう。みそベースのこっくりした味わいが冬のおもてなしにぴったり。", ingredients:"スペアリブ、大根、みそ、酒", time:"約35分", url:"https://tennenseikatsu.jp/_tags/%E9%95%B7%E8%B0%B7%E5%B7%9D%E3%81%82%E3%81%8B%E3%82%8A", source:"天然生活" },
  { season:["冬"], title:"白いミネストローネ", desc:"だしはとらない、味つけは塩だけなのに驚きのおいしさ。白い見た目が上品で、冬野菜の旨みが凝縮されたやさしいスープが体を温める。", ingredients:"白菜、じゃがいも、玉ねぎ、塩", time:"約25分", url:"https://www.orangepage.net/food/series-food/hasegawaakari", source:"オレンジページ" },
  { season:["冬"], title:"レモンバター香るチキンソテー", desc:"鶏むね肉が驚きのしっとり感に仕上がると話題のレシピ。レモンとバターの香りが鶏肉を上品に包み込み、ひと口目から感動する冬の定番。", ingredients:"鶏むね肉、レモン、バター、にんにく", time:"約20分", url:"https://www.orangepage.net/food/series-food/akarikihon", source:"オレンジページ" },
  { season:["春","夏","秋","冬"], title:"絶品白あえ 粉チーズで", desc:"豆腐を水切りせず粉チーズで和える天才的な発想。手間なしで作れるのに濃厚でコクのある白あえが完成する万能副菜。", ingredients:"豆腐、粉チーズ、ごま、醤油", time:"約5分", url:"https://www.orangepage.net/food/series-food/akarikihon", source:"オレンジページ" },
  { season:["春","夏","秋","冬"], title:"しょうゆオムライス", desc:"バターではなく醤油で炒めるオムライスが新鮮で後を引くおいしさ。和の風味がふわとろ卵とご飯に絡まって「これだ」と言いたくなる。", ingredients:"米、卵、鶏肉、醤油", time:"約20分", url:"https://www.kikkoman.co.jp/homecook/theme/popular/hasegawaakari.html", source:"キッコーマン" },
  { season:["春","夏","秋","冬"], title:"しょうゆだけから揚げ", desc:"下味は醤油だけというシンプルさなのに絶品のから揚げ。素材の旨みがぎゅっと凝縮されて、余計なものを加えない潔さがあかりさんらしい。", ingredients:"鶏もも肉、醤油、片栗粉、揚げ油", time:"約20分", url:"https://www.kikkoman.co.jp/homecook/theme/popular/hasegawaakari.html", source:"キッコーマン" },
];

function getSeason() {
  const m = new Date().getMonth() + 1;
  if (m >= 3 && m <= 5)  return { name:'春', en:'spring', label:'SPRING — 春' };
  if (m >= 6 && m <= 8)  return { name:'夏', en:'summer', label:'SUMMER — 夏' };
  if (m >= 9 && m <= 11) return { name:'秋', en:'autumn', label:'AUTUMN — 秋' };
  return { name:'冬', en:'winter', label:'WINTER — 冬' };
}

let season, pool, idx;

function init() {
  season = getSeason();
  document.getElementById('seasonBadge').textContent = season.label;
  document.getElementById('app').className = 'container ' + season.en;
  pool = RECIPES.filter(r => r.season.includes(season.name));
  pool = shuffle(pool);
  idx = 0;
  showRecipe();
}

function nextRecipe() {
  idx = (idx + 1) % pool.length;
  const card = document.getElementById('recipeCard');
  card.classList.remove('swap');
  void card.offsetWidth;
  card.classList.add('swap');
  showRecipe();
}

function showRecipe() {
  const r = pool[idx];

  document.getElementById('recipeTitle').textContent = r.title;
  document.getElementById('recipeDesc').textContent  = r.desc;
  document.getElementById('seasonTag').textContent   = r.season.length > 1 ? '年中' : season.name + 'のレシピ';

  const meta = document.getElementById('recipeMeta');
  meta.innerHTML = `<span class="meta-item">${r.ingredients}</span>`;
  if (r.time) meta.innerHTML += `<span class="meta-item">${r.time}</span>`;

  const tweetWrap = document.getElementById('tweetWrap');

  if (r.tweetId) {
    // X埋め込み
    const xUrl = `https://twitter.com/akari_hasegawa/status/${r.tweetId}`;
    tweetWrap.innerHTML = `
      <p class="tweet-label">Xで食材・作り方を確認</p>
      <blockquote class="twitter-tweet" data-lang="ja" data-dnt="true">
        <a href="${xUrl}"></a>
      </blockquote>
    `;
    // ウィジェットを再レンダリング
    if (window.twttr && window.twttr.widgets) {
      window.twttr.widgets.load(tweetWrap);
    }
  } else if (r.url) {
    // 外部リンク
    tweetWrap.innerHTML = `
      <p class="tweet-label">食材・作り方はこちら</p>
      <a class="x-link" href="${r.url}" target="_blank" rel="noopener">↗ ${r.source}でレシピを見る</a>
    `;
  } else {
    tweetWrap.innerHTML = '';
  }

  document.getElementById('counter').textContent =
    `${season.name}のレシピ ${idx + 1} / ${pool.length}`;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

init();
</script>
